name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ----------------------------------------------------------
      # Cache the CMake build directory for faster rebuilds.
      # ----------------------------------------------------------
      - name: Cache CMake build directory
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ matrix.name }}-${{ hashFiles('**/CMakeLists.txt', '.gitmodules') }}
          restore-keys: build-${{ matrix.name }}-

      # ----------------------------------------------------------
      # System dependencies
      # unidict links: zlib, libxml2, iconv, zstd, liblzma,
      # ICU, libvorbis, libunistring (transitively via deps).
      # ----------------------------------------------------------
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            zlib1g-dev \
            libxml2-dev \
            libzstd-dev \
            liblzma-dev \
            libicu-dev \
            libvorbis-dev \
            libunistring-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake \
            zlib \
            libxml2 \
            zstd \
            xz \
            icu4c \
            libvorbis \
            libunistring

      - name: Cache vcpkg packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: vcpkg-${{ matrix.name }}-

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install zlib:x64-windows libxml2:x64-windows zstd:x64-windows liblzma:x64-windows icu:x64-windows libvorbis:x64-windows libunistring:x64-windows

      - name: Configure
        run: >
          cmake -B build -DUNIDICT_BUILD_TESTS=ON
          ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake' || '' }}
          ${{ runner.os == 'Linux' && '-DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS=-fsanitize=address -fno-omit-frame-pointer -g -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address' || '' }}

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --verbose ${{ runner.os == 'Windows' && '-C Release' || '' }}
        env:
          ASAN_OPTIONS: ${{ runner.os == 'Linux' && 'detect_leaks=0:abort_on_error=0:print_stacktrace=1' || '' }}
